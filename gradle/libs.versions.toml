[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ktlintPlugin = "14.2.0"
detekt = "1.23.8"
dokka = "2.2.0"
junit = "6.1.3"
awsSdk = "1.9.17"
androidxCore = "1.17.0"
material = "1.14.0"
appcompat = "1.7.1"
androidxExif = "1.4.1"
osmdroid = "6.1.20"
coroutines = "1.11.0"
jsoup = "1.23.2"
mockk = "1.14.11"
jacoco = "0.8.15"

[libraries]
# AWS SDK for Kotlin (OkHttp 5.5 が, compileSdk 37 以上を要求する)
aws-dynamodb = { module = "aws.sdk.kotlin:dynamodb", version.ref = "awsSdk" }
aws-s3 = { module = "aws.sdk.kotlin:s3", version.ref = "awsSdk" }
aws-cognitoidentity = { module = "aws.sdk.kotlin:cognitoidentity", version.ref = "awsSdk" }
aws-cognitoidentityprovider = { module = "aws.sdk.kotlin:cognitoidentityprovider", version.ref = "awsSdk" }
# HTML の解析 (里親募集の一覧)
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidxExif" }
osmdroid = { module = "org.osmdroid:osmdroid-android", version.ref = "osmdroid" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
